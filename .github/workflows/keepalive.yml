name: Saytni uyg'oq tutish (keep-alive)

on:
  schedule:
    # Har 10 daqiqada saytga so'rov yuboradi.
    # Render bepul rejasi 15 daqiqa harakatsizlikdan keyin uxlab qoladi.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Saytga so'rov yuborish
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://ichimliklar-uz.onrender.com/healthz/ | tee /dev/stderr | grep -q '"status": *"ok"'
          echo "Sayt va baza javob berdi ✅"
